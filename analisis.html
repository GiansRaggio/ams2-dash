<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060a">
<title>AMS2 · Análisis</title>
<!--
  VISOR DE TELEMETRIA. Pagina aparte a proposito: el dash de manejar corre a rAF
  con el WebSocket encima y no tiene por que cargar el peso de un analizador que
  solo se usa parado en boxes. Se sirve del mismo puerto, asi que se abre igual
  desde el celular o desde el PC.

  Todo se dibuja en canvas y se compara POR DISTANCIA, nunca por tiempo: dos
  vueltas duran distinto, asi que superpuestas por tiempo se desfasan cada vez
  mas y el grafico deja de significar nada a mitad de vuelta.
-->
<style>
  :root{
    --bg:#04060a; --panel:#0d1118; --panel2:#11161f; --line:#1f2733;
    --txt:#eef3fa; --dim:#5d6b7e;
    --green:#2bf07a; --amber:#ffb020; --red:#ff2e4d;
    --blue:#3f8cff; --cyan:#27e0ff; --purple:#b44dff;
    --mono:ui-monospace,"JetBrains Mono","Cascadia Mono","Roboto Mono",monospace;
    --chamfer:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{background:radial-gradient(120% 90% at 50% -20%,#0b1220 0%,var(--bg) 55%),var(--bg);
       color:var(--txt);font-family:var(--mono);font-size:14px;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .label{font-size:max(9px,1.2vh);letter-spacing:.2em;color:var(--dim);text-transform:uppercase;font-weight:600}
  .box{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
       clip-path:var(--chamfer);padding:8px 10px}

  /* ---------- cabecera ---------- */
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0b1018 70%,#0b101800);
         padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
  .hrow{display:flex;gap:8px;align-items:center}
  #volver{flex:none;font-size:max(13px,1.7vh);color:var(--dim);text-decoration:none;padding:6px 10px;
          border:1px solid var(--line);border-radius:4px}
  select,button{font-family:var(--mono);background:var(--panel2);color:var(--txt);
                border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:max(12px,1.5vh)}
  select{flex:1;min-width:0}
  #meta{font-size:max(11px,1.4vh);color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
  #meta b{color:var(--txt);font-weight:700}

  /* ---------- tandas ---------- */
  #tandas{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  #tandas::-webkit-scrollbar{display:none}
  .tanda{flex:none;padding:7px 11px;border:1px solid var(--line);border-radius:4px;background:var(--panel);
         font-size:max(12px,1.5vh);color:var(--dim);white-space:nowrap;cursor:pointer}
  .tanda.sel{border-color:var(--cyan);color:var(--txt);box-shadow:0 0 0 1px var(--cyan) inset}
  .tanda small{display:block;font-size:max(9px,1.1vh);opacity:.65;letter-spacing:.05em}

  main{padding:0 10px 24px;display:flex;flex-direction:column;gap:10px}

  /* ---------- mapa ---------- */
  #mapwrap{position:relative}
  #mapa{width:100%;display:block;touch-action:none}
  #leyenda{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:3px;
           font-size:max(9px,1.1vh);color:var(--dim);text-align:right;pointer-events:none}
  #leyenda i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
  #leyenda b{color:var(--txt);font-weight:400;margin-right:4px}

  /* ---------- chips de curva + tabla de puntos por curva ---------- */
  #curvachips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  #curvachips::-webkit-scrollbar{display:none}
  #eventos{overflow-x:auto}
  #eventos table{border-collapse:collapse;white-space:nowrap;
                 font-size:max(10px,1.25vh);font-variant-numeric:tabular-nums}
  #eventos th,#eventos td{padding:3px 7px;text-align:right;border-bottom:1px solid #131a23}
  #eventos thead th{color:var(--dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase;
                    font-size:max(9px,1.1vh);border-bottom:1px solid var(--line)}
  #eventos .g{border-left:1px solid var(--line)}
  #eventos td.t{text-align:left;color:var(--dim);font-weight:700}
  #eventos td.a{color:var(--cyan)}
  #eventos td.b{color:var(--red)}
  #eventos tbody tr{cursor:pointer}
  #eventos tbody tr.aqui{background:#141d29}
  #eventos tbody tr.aqui td.t{color:var(--txt)}

  /* ---------- vueltas ---------- */
  #vueltas{display:flex;flex-direction:column;gap:3px;max-height:38vh;overflow-y:auto}
  .v{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);
     border-radius:4px;background:var(--panel);font-size:max(12px,1.5vh)}
  .v.inv{opacity:.5}
  .v .n{color:var(--dim);width:3.2em;flex:none}
  .v .t{font-variant-numeric:tabular-nums;font-weight:700;flex:1}
  .v .d{font-variant-numeric:tabular-nums;color:var(--dim);font-size:max(11px,1.3vh)}
  .v .sel{flex:none;width:26px;height:26px;border-radius:4px;border:1px solid var(--line);
          background:var(--panel2);color:var(--dim);font-weight:700;font-size:max(11px,1.3vh)}
  .v .sel.on.a{border-color:var(--cyan);color:#04060a;background:var(--cyan)}
  .v .sel.on.b{border-color:var(--red);color:#fff;background:var(--red)}
  .v.notrace .t{color:var(--dim);font-weight:400}
  .v.notrace .sel{opacity:.25}

  /* ---------- cursor / lectura ---------- */
  #lectura{position:sticky;bottom:0;z-index:15;background:linear-gradient(0deg,#0b1018 78%,#0b101800);
           padding:8px 10px 10px;font-size:max(11px,1.4vh)}
  #lectura .fila{display:grid;grid-template-columns:5.5em 1fr 1fr;gap:6px;align-items:baseline}
  #lectura .k{color:var(--dim)}
  #lectura .a{color:var(--cyan);font-variant-numeric:tabular-nums;font-weight:700}
  #lectura .b{color:var(--red);font-variant-numeric:tabular-nums;font-weight:700}
  #curva{font-weight:800;font-size:max(15px,2vh);letter-spacing:.05em}

  /* ---------- graficos ---------- */
  .g{position:relative}
  .g canvas{width:100%;display:block;touch-action:none}
  .g .tit{position:absolute;left:8px;top:5px;pointer-events:none}
  .aviso{color:var(--amber);font-size:max(11px,1.3vh);padding:2px 2px 0}
  #vacio{color:var(--dim);text-align:center;padding:30px 10px;line-height:1.7}
  .fnota{color:var(--dim);font-size:max(10px,1.2vh);line-height:1.5}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <a id="volver" href="/">←</a>
    <select id="sesion"></select>
    <button id="recargar" title="releer del disco">↻</button>
  </div>
  <div id="meta"></div>
  <div id="tandas"></div>
</header>

<main>
  <div id="vacio" class="box">cargando…</div>

  <div id="app" style="display:none;flex-direction:column;gap:10px">
    <div class="box" id="mapwrap">
      <canvas id="mapa"></canvas>
      <div id="leyenda"></div>
    </div>

    <div id="curvachips"></div>
    <div id="eventos"></div>

    <div>
      <div class="label" style="padding:0 2px 4px">vueltas de la tanda · A para ver · B para comparar</div>
      <div id="vueltas"></div>
    </div>

    <div id="avisos"></div>
    <div id="graficos" style="display:flex;flex-direction:column;gap:8px"></div>

    <div class="hrow" style="gap:8px">
      <button id="csv" style="flex:1">⬇ exportar tanda a CSV</button>
      <label class="fnota" style="display:flex;align-items:center;gap:5px">
        <input type="checkbox" id="solovalidas"> solo válidas
      </label>
    </div>
    <div class="fnota" id="pie"></div>
  </div>
</main>

<div id="lectura" style="display:none">
  <div class="fila"><span id="curva" style="grid-column:1/2">—</span>
    <span class="a" id="lecA" style="grid-column:2/3"></span>
    <span class="b" id="lecB" style="grid-column:3/4"></span></div>
  <div id="lecfilas"></div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const api = (r, q) => fetch("/api/" + r + "?" + new URLSearchParams(q)).then(async res => {
  const j = await res.json();
  if (!res.ok) throw new Error(j.error || res.status);
  return j;
});

// ---------------------------------------------------------------- estado ---
const S = {
  sesion: null, meta: null, tandas: [], tanda: 0,
  mapa: null, trazas: new Map(),      // nombre de archivo -> traza remuestreada
  A: null, B: null,                   // nombres de archivo de las vueltas elegidas
  cursor: null,                       // indice en la grilla de metros
  vista: null,                        // {cx,cz,k} en coords de mundo; null = pista completa
  curvaZoom: null,                    // n de la curva a la que se entro (para resaltarla)
  lienzoMapa: null,                   // {w,h,kFit} del ultimo pintado (lo usan los chips)
  rotulos: [],                        // rotulos Tn dibujados, para poder tocarlos
  pinch: null,                        // distancia entre los dos dedos del pellizco
};

const K_MAX = 25;                     // px/m: mas zoom que esto y no cabe una curva entera

const CANALES = [
  {k:"speed_kmh", tit:"velocidad", u:"km/h", alto:96, dec:0},
  {k:"throttle",  tit:"acelerador", u:"%",   alto:70, dec:0, esc:[0,1], pct:true},
  {k:"brake",     tit:"freno",      u:"%",   alto:70, dec:0, esc:[0,1], pct:true},
  {k:"gear",      tit:"marcha",     u:"",    alto:64, dec:0, paso:true},
  {k:"rpm",       tit:"rpm",        u:"",    alto:70, dec:0},
  {k:"steer",     tit:"volante",    u:"",    alto:64, dec:2, esc:[-1,1]},
];

// -------------------------------------------------------------- utilidades ---
const t2s = t => t == null ? "—" :
  (t >= 60 ? Math.floor(t/60) + ":" + (t%60).toFixed(3).padStart(6,"0") : t.toFixed(3));
const dpr = () => Math.min(window.devicePixelRatio || 1, 2.5);

// Devuelve null si todavia no hay ancho con que dibujar y se reagenda solo.
// Pasa de verdad: pestaña en segundo plano, o la pagina abierta desde el icono
// de inicio en iOS antes de que WebKit haga el primer layout. Sin esto el canvas
// se dibuja de 0 px, queda en blanco y NO se vuelve a pintar nunca -- se ve
// exactamente igual que un error de datos.
let reintento = null;
function lienzo(cv, alto){
  const w = cv.clientWidth || cv.parentElement.clientWidth;
  if (w < 50){
    if (!reintento) reintento = requestAnimationFrame(() => { reintento = null; pintarTodo(); });
    return null;
  }
  const r = dpr();
  cv.width = Math.round(w * r); cv.height = Math.round(alto * r);
  cv.style.height = alto + "px";
  const c = cv.getContext("2d");
  c.setTransform(r, 0, 0, r, 0, 0);
  c.clearRect(0, 0, w, alto);
  return {c, w, h: alto};
}

// ---------------------------------------------------------------- sesiones ---
async function cargarSesiones(){
  const j = await api("sesiones", {n: 60});
  const sel = $("sesion");
  sel.innerHTML = "";
  for (const s of j.sesiones){
    const o = document.createElement("option");
    o.value = s.carpeta;
    const f = (s.inicio || "").slice(5,16).replace("T"," ");
    o.textContent = `${f}  ${(s.pista||"?").replace(/_/g," ")} · ${(s.auto||"?").replace(/_/g," ")}`
                  + (s.vueltas ? `  (${s.vueltas}v)` : "");
    sel.appendChild(o);
  }
  if (!j.sesiones.length) throw new Error("no hay sesiones grabadas todavía");
  // Arrancar en la ultima sesion CON VUELTAS, no en la ultima a secas: una qualy
  // donde todas las vueltas salieron invalidadas existe como carpeta pero no
  // tiene nada que mostrar, y abrir en ella parece que el visor esta roto.
  const conDatos = j.sesiones.find(s => s.vueltas > 0);
  const elegida = (conDatos || j.sesiones[0]).carpeta;
  sel.value = elegida;
  return elegida;
}

async function cargarSesion(carpeta, mantenerTanda){
  S.sesion = carpeta;
  const j = await api("sesion", {s: carpeta});
  S.meta = j.meta; S.tandas = j.tandas;
  const conTraza = S.tandas.map((t,i) => [i, t.con_traza]).filter(x => x[1] > 0);
  if (!mantenerTanda || S.tanda >= S.tandas.length)
    S.tanda = conTraza.length ? conTraza[conTraza.length-1][0] : S.tandas.length - 1;

  $("meta").innerHTML = S.tandas.length
    ? `<span><b>${(S.meta.track||"?").replace(/_/g," ")}</b></span>
       <span>${(S.meta.car||"?").replace(/_/g," ")}</span>
       <span>${S.meta.session||""}</span>
       <span>${S.tandas.length} tanda${S.tandas.length>1?"s":""}</span>`
    : "";
  pintarTandas();
  // otra pista, otras coordenadas de mundo: el zoom guardado no significa nada
  S.mapa = null; S.vista = null; S.curvaZoom = null;
  sigChips = ""; sigEventos = "";
  if (S.tandas.some(t => t.con_traza > 0)){
    try { S.mapa = await api("mapa", {s: carpeta}); } catch(e){}
  }
  await cargarTanda();
}

function pintarTandas(){
  const c = $("tandas"); c.innerHTML = "";
  S.tandas.forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "tanda" + (i === S.tanda ? " sel" : "");
    d.innerHTML = `T${t.n} <small>${t.con_traza}/${t.n_vueltas}v · ${t.mejor ? t2s(t.mejor) : "—"}</small>`;
    d.onclick = () => { S.tanda = i; S.A = S.B = null; pintarTandas(); cargarTanda(); };
    c.appendChild(d);
  });
}

async function cargarTanda(){
  const t = S.tandas[S.tanda];
  const conTraza = t ? t.vueltas.filter(v => v.traza) : [];
  $("vacio").style.display = conTraza.length ? "none" : "block";
  $("app").style.display   = conTraza.length ? "flex" : "none";
  $("lectura").style.display = conTraza.length ? "block" : "none";
  if (!conTraza.length){
    $("vacio").textContent = t
      ? `La tanda T${t.n} no tiene ninguna vuelta con traza guardada.\n` +
        `El grabador solo guarda la traza de las vueltas limpias.`
      : "Esta sesión no tiene tandas.";
    return;
  }
  // por defecto: la mas rapida como A, la segunda como B (la comparacion util de entrada)
  const orden = [...conTraza].sort((a,b) => (a.tiempo||9e9) - (b.tiempo||9e9));
  if (!S.A || !conTraza.some(v => v.traza === S.A)) S.A = orden[0].traza;
  if (!S.B || !conTraza.some(v => v.traza === S.B)) S.B = orden[1] ? orden[1].traza : null;
  pintarVueltas();
  await asegurarTrazas();
  S.cursor = null;
  pintarTodo();
}

function pintarVueltas(){
  const t = S.tandas[S.tanda];
  const cont = $("vueltas"); cont.innerHTML = "";
  const mejor = Math.min(...t.vueltas.filter(v => v.tiempo && v.traza).map(v => v.tiempo));
  for (const v of t.vueltas){
    const d = document.createElement("div");
    d.className = "v" + (v.valida ? "" : " inv") + (v.traza ? "" : " notrace");
    const dif = v.tiempo && v.traza && v.tiempo !== mejor ? "+" + (v.tiempo - mejor).toFixed(3) : "";
    d.innerHTML = `<span class="n">L${v.vuelta}</span>
      <span class="t">${v.tiempo ? t2s(v.tiempo) : "—"}</span>
      <span class="d">${dif || (v.traza ? "" : (v.tipo === "out" ? "salida" : v.tipo === "invalid" ? "invalidada" : v.tipo))}</span>`;
    for (const cual of ["A","B"]){
      const b = document.createElement("button");
      b.className = "sel " + cual.toLowerCase() + (S[cual] === v.traza ? " on" : "");
      b.textContent = cual;
      b.disabled = !v.traza;
      b.onclick = async () => {
        if (!v.traza) return;
        S[cual] = (S[cual] === v.traza) ? null : v.traza;
        if (cual === "A" && S.A === S.B) S.B = null;
        if (cual === "B" && S.B === S.A) S.A = null;
        pintarVueltas(); await asegurarTrazas(); pintarTodo();
      };
      d.appendChild(b);
    }
    cont.appendChild(d);
  }
}

async function asegurarTrazas(){
  for (const n of [S.A, S.B]){
    if (n && !S.trazas.has(n))
      S.trazas.set(n, await api("traza", {s: S.sesion, t: n}));
  }
  const a = S.A && S.trazas.get(S.A), b = S.B && S.trazas.get(S.B);
  const av = [];
  for (const [tr, cual] of [[a,"A"],[b,"B"]]){
    if (tr && tr.cierre_s > 0.05)
      av.push(`⚠ la traza de la vuelta ${cual} termina ${(tr.cierre_s*1000).toFixed(0)} ms antes de meta ` +
              `(la grabación se quedó corta); ese tramo se completó con el cronómetro.`);
  }
  $("avisos").innerHTML = av.map(x => `<div class="aviso">${x}</div>`).join("");
}

// -------------------------------------------------------------- pintado ---
function serie(nombre, canal){
  const tr = nombre && S.trazas.get(nombre);
  return tr && tr.canales[canal] ? tr.canales[canal] : null;
}

function nPuntos(){
  const a = S.A && S.trazas.get(S.A), b = S.B && S.trazas.get(S.B);
  const la = a ? a.metros.length : 0, lb = b ? b.metros.length : 0;
  return (la && lb) ? Math.min(la, lb) : (la || lb);
}

function metros(){
  const a = S.A && S.trazas.get(S.A) || S.B && S.trazas.get(S.B);
  return a ? a.metros : [];
}

function pintarTodo(){
  pintarMapa();
  pintarChips();
  pintarEventos();
  pintarGraficos();
  pintarLectura();
}

/* ======================= EL MAPA ES PARA COMPARAR TRAZADA =======================

   Antes dibujaba UN trazado -- el de la vuelta mas rapida de la sesion --
   coloreado por lo que hacia el pie en la vuelta A. Eso sirve para ubicarse y
   para nada mas: las dos vueltas comparten linea, asi que dos trazadas
   distintas se ven identicas. Ahora se dibuja el RECORRIDO REAL de cada vuelta
   con sus propios `pos_x`/`pos_z`, uno encima del otro, y encima los cuatro
   puntos de cada curva (frenada, giro, apex, a fondo) que calcula el backend.

   Por eso el zoom por curva NO es una comodidad, es lo que hace comparable el
   dibujo: a pista completa, 4 km de circuito en 1900 px son ~2 m/px, asi que
   una diferencia de trazada de 1 m -- media rueda en el auto, decimas en el
   crono -- ocupa medio pixel. Invisible. Entrando a una curva se llega a 10-25
   px/m y la misma diferencia se ve del ancho de un dedo.

   Lo unico DECORATIVO es la banda oscura de fondo: 12 m de ancho nominal
   alrededor de la linea de referencia. El juego NO entrega el ancho de pista,
   asi que esa banda no mide nada. Esta para que las trazadas se lean contra
   "asfalto" y para que se note de una cuando una vuelta va por afuera de la
   otra.

   El arrastre de UN puntero sigue siendo el CURSOR de lectura, que es la
   interaccion principal del visor. No hay pan por arrastre a proposito: para
   moverse estan los chips de curva, la rueda del mouse y el pellizco.
   =========================================================================== */

const LEYENDA = [
  ["<i style='background:#27e0ff'></i>", "vuelta A"],
  ["<i style='background:#ff2e4d'></i>", "vuelta B"],
  ["<i style='background:#8fa0b5;height:6px'></i>", "grueso = frenando"],
  ["<b>●</b>", "frenada"], ["<b>◆</b>", "giro"],
  ["<b>○</b>", "ápex"],    ["<b>▲</b>", "a fondo"],
];

function pintarMapa(){
  const cv = $("mapa"), M = S.mapa;
  if (!M || !M.x || !M.x.length){ cv.style.display = "none"; return; }
  cv.style.display = "block";
  $("leyenda").innerHTML = LEYENDA.map(([g,t]) => `<span>${g}${t}</span>`).join("");

  const pad = 24;
  const x0 = Math.min(...M.x), x1 = Math.max(...M.x);
  const z0 = Math.min(...M.z), z1 = Math.max(...M.z);
  const dx = (x1 - x0) || 1, dz = (z1 - z0) || 1;

  // Alto: lo mas grande que quepa. Tope por pantalla (72% del alto de la
  // ventana) y tope por FORMA -- si la pista es apaisada, mas alto que
  // `ancho*ratio` es aire vacio arriba y abajo, no mapa mas grande.
  const wcss = cv.clientWidth || cv.parentElement.clientWidth || 0;
  const alto = Math.round(Math.max(260, Math.min((window.innerHeight || 700) * 0.72,
                                                 wcss * (dz/dx) + 2*pad)));
  const lz = lienzo(cv, alto);
  if (!lz) return;
  const {c, w, h} = lz;

  const kFit = Math.min((w - 2*pad)/dx, (h - 2*pad)/dz);
  const V = S.vista || {cx: (x0+x1)/2, cz: (z0+z1)/2, k: kFit};
  const k = V.k;
  const X = x => w/2 + (x - V.cx)*k;
  const Y = z => h/2 - (z - V.cz)*k;          // Z crece hacia el norte -> hacia arriba
  S.lienzoMapa = {w, h, kFit};

  const trA = S.A && S.trazas.get(S.A), trB = S.B && S.trazas.get(S.B);
  const conPos = tr => !!(tr && tr.canales && tr.canales.pos_x && tr.canales.pos_z);
  const hayPos = conPos(trA) || conPos(trB);

  // ---- 1. banda de "pista": ancho nominal, decorativa (ver cabecera) ----
  c.lineCap = "round"; c.lineJoin = "round";
  c.strokeStyle = "#151b24"; c.lineWidth = Math.max(k*12, 8);
  c.beginPath(); c.moveTo(X(M.x[0]), Y(M.z[0]));
  for (let i = 1; i < M.x.length; i++) c.lineTo(X(M.x[i]), Y(M.z[i]));
  c.stroke();

  // ---- 2. linea de meta: perpendicular al trazado, cruzando la pista ----
  {
    const ux = X(M.x[1]) - X(M.x[0]), uy = Y(M.z[1]) - Y(M.z[0]);
    const L = Math.hypot(ux, uy) || 1, r = Math.max(9, Math.min(k*7, 70));
    c.strokeStyle = "#eef3fa"; c.lineWidth = 3;
    c.beginPath();
    c.moveTo(X(M.x[0]) - uy/L*r, Y(M.z[0]) + ux/L*r);
    c.lineTo(X(M.x[0]) + uy/L*r, Y(M.z[0]) - ux/L*r);
    c.stroke();
  }

  // ---- 3. recorridos reales: B abajo, A encima ----
  const recorrido = (tr, color) => {
    const px = tr.canales.pos_x, pz = tr.canales.pos_z, br = tr.canales.brake;
    const n = Math.min(px.length, pz.length);
    const frena = i => !!br && br[i] > 0.02;
    c.strokeStyle = color;
    let i = 0;
    while (i < n-1){
      const f = frena(i);
      let j = i + 1;
      while (j < n-1 && frena(j) === f) j++;
      // Un stroke por TRAMO, no por segmento: una vuelta son ~2000 puntos y
      // 2000 stroke() sueltos dejan el arrastre del cursor a los tirones.
      c.lineWidth = f ? 6 : 2.5;
      c.beginPath(); c.moveTo(X(px[i]), Y(pz[i]));
      for (let q = i+1; q <= j; q++) c.lineTo(X(px[q]), Y(pz[q]));
      c.stroke();
      i = j;
    }
  };
  if (hayPos){
    if (conPos(trB)) recorrido(trB, "#ff2e4d");
    if (conPos(trA)) recorrido(trA, "#27e0ff");
  } else {
    // Trazas viejas (grabadas antes de que la traza trajera pos_x/pos_z): se cae
    // al comportamiento anterior -- una sola linea, coloreada por el pie.
    const tr = trA || trB;
    const brk = tr && tr.canales.brake, thr = tr && tr.canales.throttle;
    const paso = tr ? tr.paso_m : 2;
    c.lineWidth = 6;
    for (let i = 0; i < M.x.length-1; i++){
      const j = brk ? Math.min(brk.length-1, Math.round(M.metros[i]/paso)) : 0;
      c.strokeStyle = !brk ? "#3f8cff"
                    : brk[j] > 0.02 ? "#ff2e4d" : (thr[j] > 0.90 ? "#3f8cff" : "#2bf07a");
      c.beginPath(); c.moveTo(X(M.x[i]), Y(M.z[i]));
      c.lineTo(X(M.x[i+1]), Y(M.z[i+1])); c.stroke();
    }
  }

  // ---- 4. marcadores de los puntos de cada curva ----
  // Solo con zoom (>= 2 px/m, o entrando a una curva -- en un celular la curva
  // entera cabe en ~1.3 px/m y ahi los glifos son justo lo que se vino a ver).
  // A pista completa serian 4 glifos x 2 vueltas x ~15 curvas amontonados sobre
  // una linea de 2 px: se tapan entre ellos y encima tapan el trazado. La
  // lectura fina de los metros vive en la tabla de abajo, que si esta siempre.
  const marca = (tr, m, tipo, color) => {
    if (m == null) return;
    const px = tr.canales.pos_x, pz = tr.canales.pos_z;
    const i = Math.max(0, Math.min(px.length-1, Math.round(m / (tr.paso_m || 2))));
    const x = X(px[i]), y = Y(pz[i]);
    if (x < -20 || y < -20 || x > w+20 || y > h+20) return;
    const a = Math.max(0, i-2), b = Math.min(px.length-1, i+2);
    const ang = Math.atan2(Y(pz[b]) - Y(pz[a]), X(px[b]) - X(px[a]));
    c.lineWidth = 1.5; c.strokeStyle = "#04060a"; c.fillStyle = color;
    c.beginPath();
    if (tipo === "frenada"){
      c.arc(x, y, 5, 0, 7); c.fill(); c.stroke();
    } else if (tipo === "giro"){
      c.moveTo(x, y-6); c.lineTo(x+6, y); c.lineTo(x, y+6); c.lineTo(x-6, y);
      c.closePath(); c.fill(); c.stroke();
    } else if (tipo === "apex"){
      c.fillStyle = "#04060a"; c.arc(x, y, 6, 0, 7); c.fill();
      c.strokeStyle = color; c.lineWidth = 2.5; c.stroke();
    } else {                                     // a fondo: triangulo hacia adelante
      const p = (d, s) => [x + Math.cos(ang)*d - Math.sin(ang)*s,
                           y + Math.sin(ang)*d + Math.cos(ang)*s];
      const v = [p(8,0), p(-5,5), p(-5,-5)];
      c.moveTo(v[0][0], v[0][1]); c.lineTo(v[1][0], v[1][1]); c.lineTo(v[2][0], v[2][1]);
      c.closePath(); c.fill(); c.stroke();
    }
  };
  if (k >= 2 || S.vista){
    for (const [tr, col] of [[trB, "#ff2e4d"], [trA, "#27e0ff"]]){
      if (!conPos(tr) || !tr.eventos) continue;
      for (const e of tr.eventos){
        marca(tr, e.frenada_m, "frenada", col);
        marca(tr, e.giro_m,    "giro",    col);
        marca(tr, e.apex_m,    "apex",    col);
        marca(tr, e.gas_m,     "gas",     col);
      }
    }
  }

  // ---- 5. rotulos Tn, corridos hacia AFUERA para no tapar el trazado ----
  c.font = `700 ${Math.max(10, Math.round(w/40))}px ui-monospace,monospace`;
  c.textAlign = "center"; c.textBaseline = "middle";
  const pasoMapa = (M.metros[1] - M.metros[0]) || 1;
  S.rotulos = [];
  for (const cu of M.curvas){
    const j = Math.min(Math.max(Math.round(cu.metro/pasoMapa), 1), M.x.length-2);
    const nx = -(Y(M.z[j+1]) - Y(M.z[j-1])), ny = (X(M.x[j+1]) - X(M.x[j-1]));
    const L = Math.hypot(nx, ny) || 1;
    const r = Math.max(9, Math.min(w/48, 20));
    const s = (cu.lado === "izq" ? -1 : 1) * (r + Math.max(6, k*6));
    const rx = X(M.x[j]) + nx/L*s, ry = Y(M.z[j]) + ny/L*s;
    if (rx < -r || ry < -r || rx > w+r || ry > h+r) continue;   // con zoom, solo las visibles
    const sel = S.curvaZoom === cu.n;
    c.fillStyle = "#0d1118"; c.beginPath(); c.arc(rx, ry, r, 0, 7); c.fill();
    c.strokeStyle = sel ? "#27e0ff" : "#1f2733"; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = sel ? "#eef3fa" : "#5d6b7e";
    c.fillText("T"+cu.n, rx, ry);
    S.rotulos.push({n: cu.n, x: rx, y: ry, r});
  }

  // ---- 6. cursor: un punto por vuelta, cada uno en SU posicion ----
  if (S.cursor != null){
    const punto = (x, y) => {
      c.fillStyle = "#fff"; c.beginPath(); c.arc(x, y, 5, 0, 7); c.fill();
      c.strokeStyle = "#04060a"; c.lineWidth = 2; c.stroke();
    };
    if (hayPos){
      for (const tr of [trB, trA]){
        if (!conPos(tr)) continue;
        const i = Math.min(S.cursor, tr.canales.pos_x.length-1);
        punto(X(tr.canales.pos_x[i]), Y(tr.canales.pos_z[i]));
      }
    } else {
      const paso = (trA || trB) ? (trA || trB).paso_m : 2;
      const i = Math.min(M.x.length-1, Math.round(S.cursor*paso / pasoMapa));
      punto(X(M.x[i]), Y(M.z[i]));
    }
  }

  // ------------------------------------------------------------ interaccion ---
  const zoomEn = (px, py, factor) => {
    const wx = V.cx + (px - w/2)/k, wz = V.cz - (py - h/2)/k;
    const k2 = Math.max(kFit, Math.min(K_MAX, k*factor));
    if (k2 <= kFit*1.001){ S.vista = null; S.curvaZoom = null; }
    else S.vista = {cx: wx - (px - w/2)/k2, cz: wz + (py - h/2)/k2, k: k2};
    pintarTodo();
  };

  const pick = (px, py) => {
    // El cursor cae sobre el RECORRIDO DE A (el que se esta mirando), no sobre
    // el mapa de referencia: con zoom las dos lineas estan separadas y engancharse
    // a la de referencia dejaria el punto blanco fuera de las dos vueltas.
    const ref = conPos(trA) ? trA : (conPos(trB) ? trB : null);
    const xs = ref ? ref.canales.pos_x : M.x, zs = ref ? ref.canales.pos_z : M.z;
    let mejor = 0, dmin = Infinity;
    for (let i = 0; i < xs.length; i++){
      const d = (X(xs[i])-px)**2 + (Y(zs[i])-py)**2;
      if (d < dmin){ dmin = d; mejor = i; }
    }
    const paso = (trA || trB) ? (trA || trB).paso_m : 2;
    S.cursor = ref ? mejor : Math.round(M.metros[mejor] / paso);
    pintarTodo();
  };

  cv.onwheel = ev => {
    ev.preventDefault();
    const r = cv.getBoundingClientRect();
    zoomEn(ev.clientX - r.left, ev.clientY - r.top, ev.deltaY < 0 ? 1.15 : 1/1.15);
  };
  cv.onpointerdown = ev => {
    const r = cv.getBoundingClientRect();
    const px = ev.clientX - r.left, py = ev.clientY - r.top;
    punteros.set(ev.pointerId, {x: px, y: py});
    if (punteros.size >= 2){                     // arranca el pellizco: nada de cursor
      const ps = [...punteros.values()];
      S.pinch = Math.hypot(ps[0].x-ps[1].x, ps[0].y-ps[1].y);
      return;
    }
    for (const rt of S.rotulos)                  // tocar el rotulo = entrar a esa curva
      if ((rt.x-px)**2 + (rt.y-py)**2 <= (rt.r+4)**2)
        return zoomCurva(M.curvas.find(x => x.n === rt.n));
    cv.setPointerCapture(ev.pointerId);
    pick(px, py);
  };
  cv.onpointermove = ev => {
    if (!punteros.has(ev.pointerId)) return;     // hover sin arrastrar: no toca nada
    const r = cv.getBoundingClientRect();
    const px = ev.clientX - r.left, py = ev.clientY - r.top;
    punteros.set(ev.pointerId, {x: px, y: py});
    if (punteros.size >= 2){
      const ps = [...punteros.values()];
      const d = Math.hypot(ps[0].x-ps[1].x, ps[0].y-ps[1].y);
      if (S.pinch > 0 && d > 0)
        zoomEn((ps[0].x+ps[1].x)/2, (ps[0].y+ps[1].y)/2, d/S.pinch);
      S.pinch = d;
      return;
    }
    pick(px, py);
  };
  cv.onpointerup = cv.onpointercancel = ev => {
    punteros.delete(ev.pointerId);
    if (punteros.size < 2) S.pinch = null;
  };
}

// Los punteros activos viven FUERA de pintarMapa: cada arrastre repinta el mapa
// (y reasigna los handlers), asi que un estado local se perderia a mitad de gesto.
const punteros = new Map();

function zoomCurva(cu){
  const M = S.mapa, lz = S.lienzoMapa;
  if (!M || !lz) return;
  if (!cu){ S.vista = null; S.curvaZoom = null; return pintarTodo(); }
  // Los bordes salen de los puntos del MAPA en [inicio-100, fin+80]: 100 m antes
  // para que entre la zona de frenada (que es donde esta la diferencia) y 80 m
  // despues para ver la salida.
  const a = cu.inicio - 100, b = cu.fin + 80;
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity, n = 0;
  for (let i = 0; i < M.metros.length; i++){
    if (M.metros[i] < a || M.metros[i] > b) continue;
    n++;
    x0 = Math.min(x0, M.x[i]); x1 = Math.max(x1, M.x[i]);
    z0 = Math.min(z0, M.z[i]); z1 = Math.max(z1, M.z[i]);
  }
  if (!n) return;
  const pad = 40;
  const k = Math.min(K_MAX, Math.max(lz.kFit,
              Math.min((lz.w - 2*pad)/Math.max(x1-x0, 1), (lz.h - 2*pad)/Math.max(z1-z0, 1))));
  S.vista = {cx: (x0+x1)/2, cz: (z0+z1)/2, k};
  S.curvaZoom = cu.n;
  // la curva va en la URL (#T3) para poder mandarle a un alumno "mira esto"
  // con el link y que le abra ya en la curva
  try { history.replaceState(null, "", "#T" + cu.n); } catch(e){}
  pintarTodo();
}

// ---- chips de curva: todo · T1 · T2 … ----
let sigChips = "";
function pintarChips(){
  const cont = $("curvachips"), M = S.mapa;
  if (!M || !M.curvas || !M.curvas.length){ cont.innerHTML = ""; sigChips = ""; return; }
  const sig = M.traza + "|" + M.curvas.length;
  if (sig !== sigChips){
    cont.innerHTML = "";
    const todo = document.createElement("div");
    todo.className = "tanda"; todo.dataset.n = "0"; todo.textContent = "todo";
    todo.onclick = () => zoomCurva(null);
    cont.appendChild(todo);
    for (const cu of M.curvas){
      const d = document.createElement("div");
      d.className = "tanda"; d.dataset.n = String(cu.n);
      d.innerHTML = `T${cu.n} <small>${cu.lado} · ${Math.round(cu.metro)}m</small>`;
      d.onclick = () => zoomCurva(cu);
      cont.appendChild(d);
    }
    sigChips = sig;
  }
  for (const el of cont.children)
    el.classList.toggle("sel", Number(el.dataset.n) === (S.curvaZoom || 0));
}

// ---- tabla de puntos por curva ----
// Los metros van RELATIVOS AL APEX DE A ("frenada -118 m") porque el metro
// absoluto de pista no le dice nada a nadie; la distancia al apex es la
// referencia con la que un piloto habla de una frenada. La Δ es A-B: positiva
// significa que A lo hace mas adelante (frena mas tarde, va a fondo despues).
const sgn = v => (v > 0 ? "+" : v < 0 ? "-" : "") + Math.abs(Math.round(v));
let sigEventos = "";
function pintarEventos(){
  const cont = $("eventos"), M = S.mapa;
  const trA = S.A && S.trazas.get(S.A), trB = S.B && S.trazas.get(S.B);
  const evA = (trA && trA.eventos) || [];
  if (!M || !evA.length){ cont.innerHTML = ""; sigEventos = ""; return; }

  const sig = [S.A, S.B, M.traza, evA.length].join("|");
  if (sig !== sigEventos){
    const eB = new Map(((trB && trB.eventos) || []).map(e => [e.n, e]));
    const hayB = !!trB;
    const rel = (v, ref, hay) => !hay ? "" : (v == null ? "—" : sgn(v - ref) + " m");
    const dif = (x, y) => !hayB ? "" : (x == null || y == null ? "—" : sgn(x - y));
    let html = `<table><thead>
      <tr><th rowspan="2">T</th>
          <th class="g" colspan="3">frenada</th>
          <th class="g" colspan="3">giro</th>
          <th class="g" colspan="4">ápex</th>
          <th class="g" colspan="3">a fondo</th></tr>
      <tr><th class="g">A</th><th>B</th><th>Δ</th>
          <th class="g">A</th><th>B</th><th>Δ</th>
          <th class="g">A</th><th>Δ</th><th>km/h A</th><th>B</th>
          <th class="g">A</th><th>B</th><th>Δ</th></tr>
      </thead><tbody>`;
    for (const a of evA){
      const b = eB.get(a.n) || {}, tiene = eB.has(a.n), ref = a.apex_m;
      const grupo = kk => `<td class="a g">${rel(a[kk], ref, true)}</td>` +
                          `<td class="b">${rel(b[kk], ref, tiene)}</td>` +
                          `<td>${dif(a[kk], b[kk])}</td>`;
      html += `<tr data-n="${a.n}"><td class="t">T${a.n}</td>`
            + grupo("frenada_m") + grupo("giro_m")
            // el apex de A es el origen de todos los metros de la fila; el de B
            // va como Δ con el MISMO signo que las otras columnas (A−B, + = A mas
            // adelante), no como "B relativo a A", que se leia al reves
            + `<td class="a g">${Math.round(ref)} m</td>`
            + `<td>${dif(a.apex_m, b.apex_m)}</td>`
            + `<td class="a">${a.vmin_kmh == null ? "—" : a.vmin_kmh.toFixed(1)}</td>`
            + `<td class="b">${!tiene || b.vmin_kmh == null ? "" : b.vmin_kmh.toFixed(1)}</td>`
            + grupo("gas_m") + `</tr>`;
    }
    cont.innerHTML = html + `</tbody></table>`;
    for (const fila of cont.querySelectorAll("tbody tr"))
      fila.onclick = () => zoomCurva(M.curvas.find(x => x.n === Number(fila.dataset.n)));
    sigEventos = sig;
  }

  // resaltar la curva donde esta el cursor (mismo criterio que la lectura de abajo)
  const mtr = metros();
  const m = (S.cursor == null || !mtr.length) ? null : mtr[Math.min(S.cursor, mtr.length-1)];
  let aqui = null;
  if (m != null) for (const x of M.curvas) if (x.inicio - 60 <= m && m <= x.fin + 40) aqui = x.n;
  for (const fila of cont.querySelectorAll("tbody tr"))
    fila.classList.toggle("aqui", Number(fila.dataset.n) === aqui);
}

// ---- graficos por distancia ----
function pintarGraficos(){
  const cont = $("graficos");
  const n = nPuntos();
  if (!n){ cont.innerHTML = ""; return; }
  const mtr = metros();
  const defs = [];
  // El titulo dice el signo explicito. Un "delta" sin decir contra que y para
  // que lado se lee al reves la mitad de las veces, y justo en el grafico que
  // decide donde estas perdiendo tiempo.
  if (S.A && S.B) defs.push({delta:true, alto:86, dec:3,
    tit:"delta A vs B · sube = A pierde · s"});
  defs.push(...CANALES.filter(c => serie(S.A, c.k) || serie(S.B, c.k)));

  if (cont.childElementCount !== defs.length){
    cont.innerHTML = "";
    for (const d of defs){
      const w = document.createElement("div");
      w.className = "g box"; w.style.padding = "0";
      w.innerHTML = `<span class="tit label"></span><canvas></canvas>`;
      cont.appendChild(w);
    }
  }
  defs.forEach((d, i) => {
    const w = cont.children[i];
    w.querySelector(".tit").textContent = d.tit + (d.u ? " · " + d.u : "");
    dibujar(w.querySelector("canvas"), d, mtr, n);
  });
}

function dibujar(cv, d, mtr, n){
  const lz = lienzo(cv, d.alto);
  if (!lz) return;
  const {c, w, h} = lz;
  const padL = 34, padR = 6, padT = 16, padB = 10;
  const W = w - padL - padR, H = h - padT - padB;
  const largo = mtr[n-1] || 1;
  const px = m => padL + m/largo*W;

  let A = null, B = null;
  if (d.delta){
    const ta = serie(S.A,"t"), tb = serie(S.B,"t");
    A = new Array(n); for (let i=0;i<n;i++) A[i] = ta[i]-tb[i];
  } else { A = serie(S.A, d.k); B = serie(S.B, d.k); }

  // escala
  let lo, hi;
  if (d.esc){ [lo,hi] = d.esc; }
  else {
    lo = Infinity; hi = -Infinity;
    for (const s of [A,B]) if (s) for (let i=0;i<n;i++){ if(s[i]<lo)lo=s[i]; if(s[i]>hi)hi=s[i]; }
    if (!isFinite(lo)) { lo = 0; hi = 1; }
    if (d.delta){ const m = Math.max(Math.abs(lo),Math.abs(hi),0.05); lo=-m; hi=m; }
    else { const m = (hi-lo)*0.08 || 1; lo -= m; hi += m; }
  }
  const py = v => padT + H - (v-lo)/(hi-lo||1)*H;

  // rejilla: las curvas, que es la referencia con la que uno habla
  if (S.mapa){
    c.strokeStyle = "#182029"; c.lineWidth = 1; c.font = "9px ui-monospace,monospace";
    c.fillStyle = "#2c3746"; c.textAlign = "center"; c.textBaseline = "top";
    for (const cu of S.mapa.curvas){
      if (cu.metro > largo) continue;
      const x = px(cu.metro);
      c.beginPath(); c.moveTo(x, padT); c.lineTo(x, padT+H); c.stroke();
      if (d.delta) c.fillText("T"+cu.n, x, 3);
    }
  }
  // cero del delta
  if (d.delta){
    c.strokeStyle = "#3a4756"; c.setLineDash([3,3]);
    c.beginPath(); c.moveTo(padL, py(0)); c.lineTo(padL+W, py(0)); c.stroke();
    c.setLineDash([]);
  }

  const trazo = (s, color) => {
    if (!s) return;
    c.strokeStyle = color; c.lineWidth = 1.6; c.beginPath();
    for (let i=0;i<n;i++){
      const X = px(mtr[i]), Y = py(s[i]);
      if (i===0) c.moveTo(X,Y);
      else if (d.paso){ c.lineTo(X, py(s[i-1])); c.lineTo(X,Y); }
      else c.lineTo(X,Y);
    }
    c.stroke();
  };
  if (d.delta){
    // relleno con signo: bajo cero ganas, sobre cero pierdes
    c.beginPath(); c.moveTo(px(mtr[0]), py(0));
    for (let i=0;i<n;i++) c.lineTo(px(mtr[i]), py(A[i]));
    c.lineTo(px(mtr[n-1]), py(0)); c.closePath();
    const g = c.createLinearGradient(0, py(hi), 0, py(lo));
    g.addColorStop(0, "rgba(255,46,77,.35)"); g.addColorStop(0.5, "rgba(255,46,77,0)");
    g.addColorStop(0.5, "rgba(43,240,122,0)"); g.addColorStop(1, "rgba(43,240,122,.35)");
    c.fillStyle = g; c.fill();
    trazo(A, "#eef3fa");
  } else {
    trazo(B, "#ff2e4d");
    trazo(A, "#27e0ff");
  }

  // eje Y: solo los extremos, que es lo que se lee de una mirada
  c.fillStyle = "#3d4a5c"; c.font = "9px ui-monospace,monospace";
  c.textAlign = "right"; c.textBaseline = "middle";
  const f = v => d.pct ? Math.round(v*100) : v.toFixed(d.dec ?? 0);
  c.fillText(f(hi), padL-4, py(hi)+4);
  c.fillText(f(lo), padL-4, py(lo)-4);

  if (S.cursor != null){
    const i = Math.min(S.cursor, n-1), x = px(mtr[i]);
    c.strokeStyle = "#8fa0b5"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x, padT); c.lineTo(x, padT+H); c.stroke();
  }

  const mover = ev => {
    const r = cv.getBoundingClientRect();
    const frac = ((ev.clientX - r.left) - padL) / W;
    S.cursor = Math.max(0, Math.min(n-1, Math.round(frac*largo / (mtr[1]-mtr[0] || 1))));
    pintarTodo();
  };
  cv.onpointerdown = ev => { cv.setPointerCapture(ev.pointerId); mover(ev); };
  cv.onpointermove = ev => { if (ev.buttons) mover(ev); };
}

// ---- lectura bajo el cursor ----
function pintarLectura(){
  const n = nPuntos();
  if (!n){ $("lectura").style.display = "none"; return; }
  $("lectura").style.display = "block";
  const i = S.cursor == null ? null : Math.min(S.cursor, n-1);
  const mtr = metros();
  const ta = S.A && S.trazas.get(S.A), tb = S.B && S.trazas.get(S.B);

  if (i == null){
    $("curva").textContent = "—";
    $("lecA").textContent = ta ? `A · L${ta.vuelta} ${t2s(ta.tiempo)}` : "";
    $("lecB").textContent = tb ? `B · L${tb.vuelta} ${t2s(tb.tiempo)}` : "";
    $("lecfilas").innerHTML = `<div class="fnota">arrastra el dedo sobre un gráfico o el mapa para leer punto por punto</div>`;
    return;
  }
  const m = mtr[i];
  let cu = null;
  if (S.mapa) for (const x of S.mapa.curvas) if (x.inicio - 60 <= m && m <= x.fin + 40) cu = x;
  $("curva").textContent = (cu ? "T"+cu.n : "—") + "  " + Math.round(m) + "m";
  $("lecA").textContent = ta ? `A L${ta.vuelta}` : "";
  $("lecB").textContent = tb ? `B L${tb.vuelta}` : "";

  const filas = [];
  if (ta && tb){
    const dv = ta.canales.t[i] - tb.canales.t[i];
    filas.push(["delta A-B", (dv>=0?"+":"") + dv.toFixed(3) + " s",
                dv >= 0 ? "A va perdiendo" : "A va ganando"]);
  }
  for (const c of CANALES){
    const a = ta && ta.canales[c.k], b = tb && tb.canales[c.k];
    if (!a && !b) continue;
    const f = v => v == null ? "" : (c.pct ? Math.round(v*100)+"%" : v.toFixed(c.dec ?? 0));
    filas.push([c.tit, f(a && a[i]), f(b && b[i])]);
  }
  $("lecfilas").innerHTML = filas.map(([k,a,b]) =>
    `<div class="fila"><span class="k">${k}</span><span class="a">${a}</span><span class="b">${b}</span></div>`).join("");
}

// ------------------------------------------------------------------ eventos ---
$("sesion").onchange = async e => { S.A = S.B = null; S.trazas.clear(); await cargarSesion(e.target.value); };
$("recargar").onclick = async () => { S.trazas.clear(); await cargarSesion(S.sesion, true); };
$("csv").onclick = () => {
  const t = S.tandas[S.tanda];
  const q = new URLSearchParams({s: S.sesion, tanda: t.n, validas: $("solovalidas").checked ? "1" : "0"});
  location.href = "/api/export?" + q;
};
let redib;
window.addEventListener("resize", () => { clearTimeout(redib); redib = setTimeout(pintarTodo, 150); });

// Refresco en vivo: mientras giras, la tanda en curso crece sola. Solo se releen
// las TANDAS (barato); las trazas ya cargadas se conservan para no perder la
// comparacion que tengas puesta en pantalla.
setInterval(async () => {
  if (!S.sesion || document.hidden) return;
  try {
    const j = await api("sesion", {s: S.sesion});
    const antes = JSON.stringify(S.tandas.map(t => [t.n, t.con_traza]));
    if (antes !== JSON.stringify(j.tandas.map(t => [t.n, t.con_traza]))){
      S.tandas = j.tandas;
      pintarTandas(); pintarVueltas();
      $("pie").textContent = "actualizado " + new Date().toLocaleTimeString();
    }
  } catch(e){}
}, 15000);

(async () => {
  try {
    const primera = await cargarSesiones();
    await cargarSesion(primera);
    // #T3 en la URL abre ya en esa curva (ver zoomCurva); el mapa necesita un
    // primer pintado con ancho real antes de poder calcular la vista
    const m = /^#T(\d+)$/.exec(location.hash);
    if (m && S.mapa) requestAnimationFrame(() => {
      const cu = S.mapa.curvas.find(c => c.n === Number(m[1]));
      if (cu) zoomCurva(cu);
    });
  } catch(e){
    // sin sesiones grabadas NO es un error: es el estado normal de una
    // instalacion recien hecha. Redactarlo como falla asusta al alumno.
    const msg = String(e.message || e);
    $("vacio").textContent = msg.includes("no hay sesiones")
      ? "Todavía no hay sesiones grabadas. Corre el dash mientras giras y las vueltas aparecen acá solas."
      : "no se pudo cargar: " + msg;
  }
})();
